services:
  shocs-lc:
    build:
      context: .
      network: host

    container_name: shocs-lc
    network_mode: host
    restart: unless-stopped

    environment:
      SHOCS_LC_BIND: "192.168.1.252:0"
      SHOCS_LC_LIFX_BROADCAST: "192.168.1.255:56700"

      # PH2-C: Axum is now loopback-only. The SHOCS gateway/Caddy instance is
      # the sole LAN-facing entry point for the web UI and API.
      SHOCS_LC_HTTP_BIND: "127.0.0.1:9999"

      # These IDs begin in Test Mode on each service start. Runtime mode changes
      # made in the debug UI are intentionally in-memory only for now.
      SHOCS_LC_CONTROLLED_IDS: "0x0000cc5b85d573d0,0x0000c66685d573d0"

      # Discovery is independent of automation and continuously refreshes
      # canonical LIFX ID -> current network address information.
      SHOCS_LC_DISCOVERY_INTERVAL_SECS: "60"

      # Poll live light state separately from discovery.
      SHOCS_LC_STATE_POLL_INTERVAL_SECS: "10"

      # Test Mode: one-minute heartbeat for active UI/mode testing.
      # Leave at 60 seconds until mode settings become configurable in PH3.
      SHOCS_LC_COLOR_INTERVAL_SECS: "60"
      SHOCS_LC_TRANSITION_SECS: "5"

      # Test Mode's existing proof-of-concept power schedule.
      SHOCS_LC_TIMEZONE: "America/New_York"
      SHOCS_LC_OFF_TIME: "02:00"
      SHOCS_LC_ON_TIME: "10:00"

      RUST_LOG: "shocs_lc=debug"
