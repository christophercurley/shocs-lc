services:
  shocs-lc:
    build:
      context: .
      network: host

    container_name: shocs-lc
    network_mode: host
    restart: unless-stopped

    environment:
      SHOCS_LC_BIND: "192.168.1.252:0"
      SHOCS_LC_LIFX_BROADCAST: "192.168.1.255:56700"

      # Canonical LIFX IDs. IP addresses remain runtime/discovery data.
      SHOCS_LC_CONTROLLED_IDS: "0x0000cc5b85d573d0,0x0000c66685d573d0"

      # Keep discovery running while the test bulbs move around the house.
      SHOCS_LC_DISCOVERY_INTERVAL_SECS: "30"

      # Visible SHOCS heartbeat: change color every ten minutes.
      SHOCS_LC_COLOR_INTERVAL_SECS: "600"

      # Fade color and power transitions over five seconds.
      SHOCS_LC_TRANSITION_SECS: "5"

      # Temporary proof-of-concept power schedule.
      SHOCS_LC_TIMEZONE: "America/New_York"
      SHOCS_LC_OFF_TIME: "02:00"
      SHOCS_LC_ON_TIME: "10:00"
