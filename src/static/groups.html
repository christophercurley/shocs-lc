<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Groups · SHOCS</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/groups.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand-link" href="/" aria-label="SHOCS home">
        <span class="brand-mark brand-mark-small" aria-hidden="true">S</span>
        <span>SHOCS</span>
      </a>
      <nav class="topnav" aria-label="Light Controller">
        <a class="topnav-link" href="/lights">Controls</a>
        <a class="topnav-link" href="/manage">Manage</a>
        <a class="topnav-link is-active" href="/groups">Groups</a>
        <a class="topnav-link" href="/modes">Modes</a>
      </nav>
    </div>
  </header>

  <main class="shell lights-shell">
    <section class="page-heading">
      <div>
        <p class="eyebrow">LIGHT CONTROLLER</p>
        <h1>Groups</h1>
        <p>Create durable SHOCS groups, manage membership, and control members together.</p>
      </div>
      <div class="refresh-status" id="groups-status" aria-live="polite">Connecting…</div>
    </section>

    <section class="group-create-card" aria-labelledby="create-group-title">
      <div>
        <h2 id="create-group-title">Create group</h2>
        <p>Groups are SHOCS-owned and may overlap. A light can belong to more than one group.</p>
      </div>
      <form id="create-group-form" class="group-create-form">
        <input
          id="new-group-name"
          class="text-input"
          type="text"
          maxlength="64"
          autocomplete="off"
          placeholder="Driveway"
          aria-label="New group name"
          required
        >
        <button class="save-button" type="submit">Create</button>
      </form>
    </section>

    <section class="group-grid" id="group-grid" aria-live="polite">
      <div class="empty-card">Loading groups…</div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
