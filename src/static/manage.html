<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Manage Lights · SHOCS</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/manage.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand-link" href="/" aria-label="SHOCS home">
        <span class="brand-mark brand-mark-small" aria-hidden="true">S</span>
        <span>SHOCS</span>
      </a>
      <nav class="topnav" aria-label="Light Controller">
        <a class="topnav-link" href="/lights">Controls</a>
        <a class="topnav-link is-active" href="/manage">Manage</a>
        <a class="topnav-link" href="/groups">Groups</a>
        <a class="topnav-link" href="/modes">Modes</a>
      </nav>
    </div>
  </header>

  <main class="shell lights-shell">
    <section class="page-heading">
      <div>
        <p class="eyebrow">LIGHT CONTROLLER</p>
        <h1>Manage</h1>
        <p>Durable SHOCS configuration for discovered and previously known lights.</p>
      </div>
      <div class="refresh-status" id="manage-status" aria-live="polite">Connecting…</div>
    </section>

    <section class="management-grid" id="management-grid" aria-live="polite">
      <div class="empty-card" id="manage-loading">Loading configured lights…</div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
