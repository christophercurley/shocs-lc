[package]
name = "shocs-lc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SHOCS LAN-local lighting controller"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
lifx = { git = "https://github.com/christophercurley/lifx-lan-rs" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
