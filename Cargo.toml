[package]
name = "shocs-lc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SHOCS LAN-local lighting controller"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
lifx = { git = "https://github.com/christophercurley/lifx-lan-rs" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
